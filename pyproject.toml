[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-secret-rotation-check"
version = "0.1.0"
description = "Offline auditor for simplified OCI Vault secret metadata inventories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-secret-rotation-check = "oci_secret_rotation_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
